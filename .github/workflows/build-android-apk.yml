name: Build Android APK

on:
  push:
    branches: [butcher-pos-dev]
    paths:
      - 'pos-android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-android/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK
        working-directory: pos-android/android
        run: |
          ./gradlew assembleDebug \
            -PappVersionCode=$((10000 + $GITHUB_RUN_NUMBER)) \
            -PappVersionName="1.0.$GITHUB_RUN_NUMBER"

      - name: Prepare APK
        working-directory: pos-android
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/pos-kacaw-1.0.$GITHUB_RUN_NUMBER.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-kacaw-1.0.${{ github.run_number }}
          path: pos-android/dist/*.apk
          if-no-files-found: error
          retention-days: 14
