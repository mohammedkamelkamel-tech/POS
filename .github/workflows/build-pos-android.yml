name: Build POS Android from latest uploaded source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "butcher-pos-full-project-source-fixed.zip"
      - ".github/workflows/build-pos-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract the exact uploaded source archive
        run: |
          test -f butcher-pos-full-project-source-fixed.zip
          rm -rf pos-android /tmp/butcher-source
          mkdir -p /tmp/butcher-source
          unzip -q butcher-pos-full-project-source-fixed.zip -d /tmp/butcher-source
          test -d /tmp/butcher-source/pos-android
          cp -a /tmp/butcher-source/pos-android ./pos-android
          rm -rf pos-android/node_modules pos-android/android/.gradle pos-android/android/app/build
          echo "Building source archive SHA256:"
          sha256sum butcher-pos-full-project-source-fixed.zip
          echo "Source root:"
          ls -la pos-android

      - name: Fix Bluetooth printer permission on Android 12+
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/karuhundeveloper/poskacaw/ThermalPrinterPlugin.java")
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          kept = [line for line in lines if "adapter.cancelDiscovery();" not in line]
          removed = len(lines) - len(kept)
          if removed:
              p.write_text("".join(kept))
              print(f"Removed {removed} cancelDiscovery call(s); paired Bluetooth printer connection does not need scanning.")
          else:
              print("No cancelDiscovery call found; source already patched.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate and patch receipt options type
        working-directory: pos-android
        run: |
          echo "ReceiptOpts references:"
          grep -R -n --include='*.ts' --include='*.tsx' --include='*.vue' --exclude-dir=node_modules --exclude-dir=dist 'ReceiptOpts' . || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = []
          for p in Path(".").rglob("*"):
              if p.is_file() and p.suffix in {".ts", ".tsx", ".vue"} and not any(x in {"node_modules","dist","build",".git"} for x in p.parts):
                  try: t = p.read_text()
                  except Exception: continue
                  if "ReceiptOpts" in t: files.append((p,t))
          if not files:
              raise SystemExit("Cannot locate ReceiptOpts in extracted project; inspect source archive layout.")
          updated = False
          for p,t in files:
              m = re.search(r"(?:export\s+)?interface\s+ReceiptOpts\s*\{", t)
              if not m: continue
              depth, i = 1, m.end()
              while i < len(t) and depth:
                  if t[i] == "{": depth += 1
                  elif t[i] == "}": depth -= 1
                  i += 1
              if depth: raise SystemExit(f"Malformed ReceiptOpts interface: {p}")
              body = t[m.end():i-1]
              if "pixelWidth" not in body:
                  t = t[:i-1] + "  pixelWidth?: 120 | 384 | 576;\n" + t[i-1:]
                  p.write_text(t)
                  updated = True
          if not updated:
              print("No interface patch required; check the declaration shown above.")
          else:
              print("Patched ReceiptOpts with optional pixelWidth.")
          PY

      - name: Configure narrow 15mm receipt width
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn, label):
              p = Path(path)
              s = p.read_text()
              out = fn(s)
              if out == s:
                  print(f"{label}: already configured")
              else:
                  p.write_text(out)
                  print(f"{label}: updated")

          # Keep the requested 15mm selector label. It uses the printable
          # raster of a 58mm thermal printer; the physical printer sets the limit.
          p = Path("src/stores/printer.ts")
          s = p.read_text()
          s = s.replace("export type PaperWidth = 32 | 48", "export type PaperWidth = 16 | 32 | 48")
          s = s.replace("const paperWidth = ref<PaperWidth>(32)", "const paperWidth = ref<PaperWidth>(16)")
          s = s.replace("paperWidth.value = all[KEYS.width] === '48' ? 48 : 32",
                        "paperWidth.value = all[KEYS.width] === '48' ? 48 : all[KEYS.width] === '32' ? 32 : 16")
          p.write_text(s)

          # Add the selector only if it is not already present.
          p = Path("src/pages/printer/PrinterPage.vue")
          s = p.read_text()
          if ">15mm</Button>" not in s:
              lines = s.splitlines(keepends=True)
              matches = [i for i,line in enumerate(lines)
                         if ':variant="paperWidth === 32 ? \'default\' : \'outline\'"' in line]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one 58mm selector variant line, found {len(matches)}")
              i = matches[0]
              indent = lines[i][:len(lines[i])-len(lines[i].lstrip())]
              block = [f'{indent}<Button\n',
                       f'{indent}  :variant="paperWidth === 16 ? \'default\' : \'outline\'"\n',
                       f'{indent}  size="sm"\n',
                       f'{indent}  @click="printer.setWidth(16)"\n',
                       f'{indent}>15mm</Button>\n']
              lines[i-1:i-1] = block
              p.write_text("".join(lines))

          # The narrow selector keeps its name but prints using 32-column
          # layout and the normal 384-dot raster. Existing 58/80mm modes remain.
          p = Path("src/pages/pos/PosPage.vue")
          s = p.read_text()
          s = s.replace("width: usePrinterStore().paperWidth,",
                        "width: usePrinterStore().paperWidth === 16 ? 32 : usePrinterStore().paperWidth,")
          start = s.find("async function printReceipt() {")
          end = s.find("function newTransaction()", start)
          if start < 0 or end < 0:
              raise SystemExit("Cannot locate printReceipt/newTransaction function boundaries")
          new_function = """async function printReceipt() {
            if (printing.value) return
            const current = lastResult.value
            if (!current?.sale?.id) {
              operationError.value = 'بيانات الفاتورة غير متوفرة. افتح الفاتورة من سجل المبيعات وأعد الطباعة.'
              return
            }
            const printer = capabilities.get<PrinterCapability>('printer')
            if (!printer) {
              operationError.value = 'الطابعة غير متصلة أو غير مهيأة. افتح إعدادات الطابعة ثم أعد المحاولة.'
              return
            }
            printing.value = true
            operationError.value = null
            try {
              const persisted = await sales.getWithItems(current.sale.id)
              const sale = persisted.sale ?? current.sale
              const items = persisted.items.length > 0 ? persisted.items : current.items
              if (sale.status !== 'completed' || !items.length) {
                throw new Error('لا توجد أصناف محفوظة لهذه الفاتورة؛ أُلغيت الطباعة حتى لا تخرج ورقة فارغة.')
              }
              const width = usePrinterStore().paperWidth
              const job = buildReceipt(sale, items, {
                storeName: settings.storeName,
                storeOwner: settings.storeOwner,
                width: width === 16 ? 32 : width,
                pixelWidth: width === 48 ? 576 : 384,
              })
              if (!job.lines.some(line => line.text.trim().length > 0)) {
                throw new Error('محتوى الفاتورة فارغ؛ لم يتم إرسال أمر للطابعة.')
              }
              await printer.print(job)
            } catch (error) {
              operationError.value = error instanceof Error ? `تعذرت طباعة الإيصال: ${error.message}` : 'تعذرت طباعة الإيصال. تحقق من اتصال الطابعة.'
            } finally {
              printing.value = false
            }
          }"""
          s = s[:start] + new_function + "\n" + s[end:]
          p.write_text(s)

          # Make the receipt option type compatible regardless of its original form.
          p = Path("src/lib/receipt.ts")
          s = p.read_text()
          m = re.search(r"^([ \t]*pixelWidth\s*\??:\s*)[^;\n]+", s, re.M)
          if m:
              s = s[:m.start()] + m.group(1) + "384 | 576" + s[m.end():]
          else:
              m = re.search(r"(interface\s+ReceiptOpts\s*\{)", s)
              if not m:
                  raise SystemExit("Cannot locate ReceiptOpts interface in receipt.ts")
              s = s[:m.end()] + "\n  pixelWidth?: 120 | 384 | 576;" + s[m.end():]
          # Ensure the generated receipt job carries its raster width.
          s, n = re.subn(r"return \{ title: `إيصال \$\{sale\.number\}`, lines \}",
                         "return { title: `إيصال ${sale.number}`, lines, pixelWidth: opts.pixelWidth ?? (w >= 48 ? 576 : 384) }",
                         s, count=1)
          if n == 0 and "pixelWidth: opts.pixelWidth" not in s:
              raise SystemExit("Cannot locate receipt job return object")
          p.write_text(s)
          print("15mm selector and repeat-print guard configured.")
          PY

      - name: Add instant thermal printing tab
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/pages/printer/PrinterPage.vue")
          s = p.read_text()
          if "function printInstantSale" not in s:
              s = s.replace(
                  "import { ref, onMounted } from 'vue'",
                  "import { ref, onMounted, computed } from 'vue'\nimport { useSalesStore } from '@/stores/sales'\nimport { useSettingsStore } from '@/stores/settings'\nimport { buildReceipt } from '@/lib/receipt'\nimport { formatRupiah } from '@/lib/money'\nimport { formatDateTime } from '@/lib/datetime'\nimport type { Sale } from '@/db/types'"
              )
              s = s.replace(
                  "const printer = usePrinterStore()",
                  "const printer = usePrinterStore()\nconst sales = useSalesStore()\nconst settings = useSettingsStore()\nconst activeTab = ref<'settings' | 'instant'>('settings')\nconst instantBusy = ref(false)\nconst instantSaleId = ref<string | null>(null)\nconst instantMessage = ref('')\nconst instantSales = computed(() => [...sales.recent].filter((sale) => sale.status === 'completed').sort((a, b) => (b.sold_at ?? 0) - (a.sold_at ?? 0)))"
              )
              s = s.replace(
                  "  await printer.load()",
                  "  await printer.load()\n  await sales.load()"
              )
              anchor = "async function testPrint() {"
              fn = """async function printInstantSale(sale: Sale) {
                if (instantBusy.value) return
                instantBusy.value = true
                instantSaleId.value = sale.id
                instantMessage.value = ''
                try {
                  const capability = capabilities.get<PrinterCapability>('printer')
                  if (!capability || !(await capability.isAvailable())) {
                    throw new Error('الطابعة غير جاهزة. اختر الطابعة من إعدادات الطباعة أولاً.')
                  }
                  const data = await sales.getWithItems(sale.id)
                  if (!data.sale || data.sale.status !== 'completed' || !data.items.length) {
                    throw new Error('لا توجد أصناف محفوظة لهذه الفاتورة؛ تم إلغاء الطباعة.')
                  }
                  const width = paperWidth.value
                  await capability.print(buildReceipt(data.sale, data.items, {
                    storeName: settings.storeName,
                    storeOwner: settings.storeOwner,
                    width: width === 48 ? 48 : 32,
                    pixelWidth: width === 48 ? 576 : 384,
                  }))
                  instantMessage.value = 'تم إرسال الفاتورة للطابعة مباشرة.'
                } catch (e) {
                  instantMessage.value = e instanceof Error ? e.message : 'تعذرت الطباعة الفورية.'
                } finally {
                  instantBusy.value = false
                  instantSaleId.value = null
                }
              }

              """
              s = s.replace(anchor, fn + anchor)
              s = s.replace(
                  '    <div class="space-y-4 p-4">',
                  '''    <div class="grid grid-cols-2 gap-2 border-b border-border bg-card p-3">
          <Button :variant="activeTab === 'settings' ? 'default' : 'outline'" @click="activeTab = 'settings'">إعدادات الطباعة</Button>
          <Button :variant="activeTab === 'instant' ? 'default' : 'outline'" @click="activeTab = 'instant'; sales.load()">الطباعة الفورية</Button>
        </div>
        <div v-if="activeTab === 'settings'" class="space-y-4 p-4">'''
              )
              # Close settings section and add instant invoice list before root closing div.
              old_end = '''    </div>
  </div>
</template>'''
              new_end = "    </div>\\n    <div v-else class=\\\"space-y-3 p-4\\\">\\n      <div class=\\\"rounded-xl border border-border bg-card p-3\\\">\\n        <p class=\\\"text-sm font-semibold\\\">الطباعة الفورية</p>\\n        <p class=\\\"mt-1 text-xs text-muted-foreground\\\">اختر فاتورة مكتملة لإرسالها مباشرة إلى الطابعة الحرارية دون فتح PDF أو معاينة.</p>\\n      </div>\\n      <p v-if=\\\"instantMessage\\\" class=\\\"rounded-lg bg-muted p-3 text-center text-sm\\\">{{ instantMessage }}</p>\\n      <div v-if=\\\"sales.loading\\\" class=\\\"p-8 text-center text-sm text-muted-foreground\\\">جارٍ تحميل الفواتير…</div>\\n      <div v-else-if=\\\"instantSales.length\\\" class=\\\"space-y-2\\\">\\n        <Card v-for=\\\"sale in instantSales\\\" :key=\\\"sale.id\\\">\\n          <CardContent class=\\\"flex items-center gap-3 p-3\\\">\\n            <div class=\\\"min-w-0 flex-1\\\">\\n              <p class=\\\"truncate text-sm font-semibold\\\">{{ sale.number }}</p>\\n              <p class=\\\"mt-1 text-xs text-muted-foreground\\\">{{ formatDateTime(sale.sold_at ?? sale.created_at) }}</p>\\n              <p class=\\\"mt-1 text-sm font-bold\\\">{{ formatRupiah(sale.total) }}</p>\\n            </div>\\n            <Button size=\\\"sm\\\" :disabled=\\\"instantBusy\\\" @click=\\\"printInstantSale(sale)\\\">\\n              <Loader2 v-if=\\\"instantSaleId === sale.id\\\" class=\\\"mr-1 size-4 animate-spin\\\" />\\n              <Printer v-else class=\\\"mr-1 size-4\\\" />\\n              اطبع الآن\\n            </Button>\\n          </CardContent>\\n        </Card>\\n      </div>\\n      <div v-else class=\\\"rounded-xl border border-dashed border-border p-8 text-center text-sm text-muted-foreground\\\">لا توجد فواتير مكتملة ضمن الفترة الحالية.</div>\\n    </div>\\n  </div>\\n</template>"\n              if old_end not in s:
                  raise SystemExit("Cannot find PrinterPage template ending for instant tab")
              s = s.replace(old_end, new_end, 1)
              p.write_text(s)
              print("Added instant thermal print tab.")
          else:
              print("Instant print tab already present.")
          PY

      - name: Add Android 57mm receipt print dialog
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Dedicated Android PrintManager path: same system print preview
          # used by the working companion app, with a 57mm custom paper size.
          helper = """import { registerPlugin } from '@capacitor/core'
          import type { ReceiptJob } from '@/services/capabilities/registry'

          interface ReceiptPrintPlugin {
            printReceipt(options: { html: string; filename: string; paperWidthMm: number }): Promise<void>
          }
          const NativeReceiptPrint = registerPlugin<ReceiptPrintPlugin>('PdfExport')

          function escapeHtml(value: string): string {
            return value.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]!)
          }

          export async function printReceiptViaAndroid(job: ReceiptJob): Promise<void> {
            const rows = job.lines.map((line) => {
              const align = line.align === 'center' ? 'center' : line.align === 'left' ? 'left' : 'right'
              const size = line.size === 'large' ? '20px' : '13px'
              return `<div class="line" style="text-align:${align};font-size:${size};font-weight:${line.bold ? 700 : 400}">${escapeHtml(line.text)}</div>`
            }).join('')
            const html = `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
              @page { size: 57mm 200mm; margin: 2mm; }
              * { box-sizing: border-box; }
              html,body { width:100%; margin:0; padding:0; direction:rtl; unicode-bidi:plaintext; }
              body { font-family: "Noto Naskh Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif; color:#000; background:#fff; }
              .line { width:100%; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55; padding:1px 0; }
              @media screen { body { width:53mm; margin:0 auto; } }
            </style></head><body>${rows}</body></html>`
            await NativeReceiptPrint.printReceipt({ html, filename: job.title || 'إيصال الكاشير', paperWidthMm: 57 })
          }
          """
          Path("src/lib/receiptPrint.ts").write_text(helper)

          p = Path("android/app/src/main/java/com/karuhundeveloper/poskacaw/PdfExportPlugin.java")
          s = p.read_text()
          if "public void printReceipt(PluginCall call)" not in s:
              method = '''
              @PluginMethod
              public void printReceipt(PluginCall call) {
                  String html = call.getString("html");
                  String filename = call.getString("filename", "إيصال الكاشير");
                  int widthMm = call.getInt("paperWidthMm", 57);
                  if (html == null || html.trim().isEmpty()) {
                      call.reject("لا توجد بيانات لطباعة الإيصال.");
                      return;
                  }
                  getActivity().runOnUiThread(() -> {
                      try {
                          WebView webView = new WebView(getContext());
                          webView.getSettings().setJavaScriptEnabled(false);
                          webView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  try {
                                      PrintManager printManager = (PrintManager) getContext().getSystemService(Context.PRINT_SERVICE);
                                      String jobName = filename.replaceAll("[\\\\\\\\/:*?\\"<>|]", "_");
                                      int widthMils = Math.round(widthMm * 1000f / 25.4f);
                                      PrintAttributes.MediaSize media = new PrintAttributes.MediaSize(
                                          "THERMAL_57MM", "57mm", widthMils, 12000);
                                      PrintAttributes attributes = new PrintAttributes.Builder()
                                          .setMediaSize(media)
                                          .setResolution(new PrintAttributes.Resolution("thermal", "Thermal", 203, 203))
                                          .setMinMargins(new PrintAttributes.Margins(40, 40, 40, 40))
                                          .build();
                                      printManager.print(jobName, view.createPrintDocumentAdapter(jobName), attributes);
                                      call.resolve();
                                  } catch (Exception e) {
                                      call.reject("تعذر فتح معاينة طباعة الإيصال: " + e.getMessage());
                                  }
                              }
                          });
                          webView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
                      } catch (Exception error) {
                          call.reject("تعذر تجهيز الإيصال للطباعة: " + error.getMessage());
                      }
                  });
              }
          '''
              pos = s.rfind("\n}")
              if pos < 0: raise SystemExit("Cannot find PdfExportPlugin class end")
              s = s[:pos] + "\n" + method + s[pos:]
              p.write_text(s)

          # Route checkout receipt printing through Android's native print UI.
          p = Path("src/pages/pos/PosPage.vue")
          s = p.read_text()
          if "printReceiptViaAndroid" not in s:
              s = s.replace("import { buildReceipt } from '@/lib/receipt'",
                            "import { buildReceipt } from '@/lib/receipt'\nimport { printReceiptViaAndroid } from '@/lib/receiptPrint'")
          s = s.replace("await printer.print(job)", "await printReceiptViaAndroid(job)")
          # Do not require selecting the legacy direct-Bluetooth printer for Android print framework.
          s = s.replace("    const printer = capabilities.get<PrinterCapability>('printer')\n    if (!printer) {\n      operationError.value = 'الطابعة غير متصلة أو غير مهيأة. افتح إعدادات الطابعة ثم أعد المحاولة.'\n      return\n    }\n", "")
          p.write_text(s)

          # Route reprints from transaction history through the same print preview.
          p = Path("src/pages/transactions/TransactionDetailPage.vue")
          s = p.read_text()
          if "printReceiptViaAndroid" not in s:
              s = s.replace("import { buildReceipt } from '@/lib/receipt'",
                            "import { buildReceipt } from '@/lib/receipt'\nimport { printReceiptViaAndroid } from '@/lib/receiptPrint'")
          s = s.replace("await printer.print(", "await printReceiptViaAndroid(")
          p.write_text(s)
          print("Android 57mm receipt print dialog integrated.")
          PY

      - name: Generate true-size thermal receipt PDF
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/karuhundeveloper/poskacaw/PdfExportPlugin.java")
          s = p.read_text()
          required = [
              "import android.content.Intent;",
              "import android.graphics.pdf.PdfDocument;",
              "import android.net.Uri;",
              "import android.view.View;",
              "import androidx.core.content.FileProvider;",
              "import java.io.File;",
              "import java.io.FileOutputStream;"
          ]
          for item in required:
              if item not in s:
                  s = s.replace("import android.content.Context;", "import android.content.Context;\n" + item, 1)
          start = s.find("    @PluginMethod\n    public void printReceipt(PluginCall call) {")
          if start < 0:
              raise SystemExit("Cannot find printReceipt plugin method")
          end = s.rfind("\n}")
          if end < start:
              raise SystemExit("Cannot find PdfExportPlugin class closing brace")
          method = r'''    @PluginMethod
              public void printReceipt(PluginCall call) {
                  final String html = call.getString("html");
                  final String filename = call.getString("filename", "إيصال الكاشير");
                  final int widthMm = call.getInt("paperWidthMm", 57);
                  if (html == null || html.trim().isEmpty()) {
                      call.reject("لا توجد بيانات لإنشاء إيصال PDF.");
                      return;
                  }
                  getActivity().runOnUiThread(() -> {
                      final WebView webView = new WebView(getContext());
                      webView.getSettings().setJavaScriptEnabled(false);
                      webView.getSettings().setUseWideViewPort(false);
                      webView.setInitialScale(100);
                      webView.setBackgroundColor(android.graphics.Color.WHITE);
                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              try {
                                  int widthPx = Math.round(widthMm * 96f / 25.4f);
                                  int widthSpec = View.MeasureSpec.makeMeasureSpec(widthPx, View.MeasureSpec.EXACTLY);
                                  int heightSpec = View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED);
                                  view.measure(widthSpec, heightSpec);
                                  int contentHeightPx = Math.max(view.getMeasuredHeight(), view.getContentHeight());
                                  contentHeightPx = Math.max(contentHeightPx, 120);
                                  view.layout(0, 0, widthPx, contentHeightPx);

                                  // Android PdfDocument uses 72-point-per-inch page units.
                                  // 57mm = 161.57pt. This creates a real narrow PDF page,
                                  // independent of the selected A4/Letter paper in PrintManager.
                                  int pageWidthPt = Math.round(widthMm * 72f / 25.4f);
                                  int pageHeightPt = Math.max(120, Math.round(contentHeightPx * 72f / 96f) + 12);
                                  PdfDocument document = new PdfDocument();
                                  PdfDocument.PageInfo info = new PdfDocument.PageInfo.Builder(
                                      pageWidthPt, pageHeightPt, 1).create();
                                  PdfDocument.Page page = document.startPage(info);
                                  page.getCanvas().scale(72f / 96f, 72f / 96f);
                                  view.draw(page.getCanvas());
                                  document.finishPage(page);

                                  File dir = new File(getContext().getCacheDir(), "thermal-receipts");
                                  if (!dir.exists() && !dir.mkdirs()) {
                                      document.close();
                                      call.reject("تعذر إنشاء مجلد إيصال PDF.");
                                      return;
                                  }
                                  String safeName = "receipt-" + System.currentTimeMillis();
                                  File pdf = new File(dir, safeName + "-" + System.currentTimeMillis() + ".pdf");
                                  try (FileOutputStream output = new FileOutputStream(pdf)) {
                                      document.writeTo(output);
                                  }
                                  document.close();

                                  Uri uri = FileProvider.getUriForFile(
                                      getContext(), getContext().getPackageName() + ".fileprovider", pdf);
                                  Intent open = new Intent(Intent.ACTION_VIEW);
                                  open.setDataAndType(uri, "application/pdf");
                                  open.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  getContext().startActivity(Intent.createChooser(open, "فتح إيصال الكاشير"));
                                  call.resolve();
                              } catch (Exception error) {
                                  call.reject("تعذر إنشاء إيصال PDF بمقاس حراري: " + error.getMessage());
                              } finally {
                                  view.destroy();
                              }
                          }
                      });
                      webView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
                  });
              }
          '''
          s = s[:start] + method + s[end:]
          p.write_text(s)
          print("Receipt printing now exports a real 57mm-wide PDF and opens it in a PDF viewer; report PDF remains A4.")
          PY

      - name: Install dependencies
        working-directory: pos-android
        run: npm ci

      - name: Inspect patched printer page before build
        working-directory: pos-android
        run: |
          echo "PrinterPage.vue around compiler error:"
          nl -ba src/pages/printer/PrinterPage.vue | sed -n "180,205p"

      - name: Build web app
        working-directory: pos-android
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: pos-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: pos-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package exact source used for build
        run: |
          zip -qr POS-latest-source-built.zip pos-android .github/workflows/build-pos-android.yml -x "pos-android/node_modules/*" "pos-android/android/.gradle/*" "pos-android/android/app/build/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-debug-apk
          path: pos-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact source used for build
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-full-project-source
          path: POS-latest-source-built.zip
          if-no-files-found: error
          retention-days: 30
