name: Build POS Android from latest uploaded source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "butcher-pos-full-project-source-fixed.zip"
      - ".github/workflows/build-pos-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract the exact uploaded source archive
        run: |
          test -f butcher-pos-full-project-source-fixed.zip
          rm -rf pos-android /tmp/butcher-source
          mkdir -p /tmp/butcher-source
          unzip -q butcher-pos-full-project-source-fixed.zip -d /tmp/butcher-source
          test -d /tmp/butcher-source/pos-android
          cp -a /tmp/butcher-source/pos-android ./pos-android
          rm -rf pos-android/node_modules pos-android/android/.gradle pos-android/android/app/build
          echo "Building source archive SHA256:"
          sha256sum butcher-pos-full-project-source-fixed.zip
          echo "Source root:"
          ls -la pos-android

      - name: Fix Bluetooth printer permission on Android 12+
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/karuhundeveloper/poskacaw/ThermalPrinterPlugin.java")
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          kept = [line for line in lines if "adapter.cancelDiscovery();" not in line]
          removed = len(lines) - len(kept)
          if removed:
              p.write_text("".join(kept))
              print(f"Removed {removed} cancelDiscovery call(s); paired Bluetooth printer connection does not need scanning.")
          else:
              print("No cancelDiscovery call found; source already patched.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate and patch receipt options type
        working-directory: pos-android
        run: |
          echo "ReceiptOpts references:"
          grep -R -n --include='*.ts' --include='*.tsx' --include='*.vue' --exclude-dir=node_modules --exclude-dir=dist 'ReceiptOpts' . || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = []
          for p in Path(".").rglob("*"):
              if p.is_file() and p.suffix in {".ts", ".tsx", ".vue"} and not any(x in {"node_modules","dist","build",".git"} for x in p.parts):
                  try: t = p.read_text()
                  except Exception: continue
                  if "ReceiptOpts" in t: files.append((p,t))
          if not files:
              raise SystemExit("Cannot locate ReceiptOpts in extracted project; inspect source archive layout.")
          updated = False
          for p,t in files:
              m = re.search(r"(?:export\s+)?interface\s+ReceiptOpts\s*\{", t)
              if not m: continue
              depth, i = 1, m.end()
              while i < len(t) and depth:
                  if t[i] == "{": depth += 1
                  elif t[i] == "}": depth -= 1
                  i += 1
              if depth: raise SystemExit(f"Malformed ReceiptOpts interface: {p}")
              body = t[m.end():i-1]
              if "pixelWidth" not in body:
                  t = t[:i-1] + "  pixelWidth?: 384 | 576;\n" + t[i-1:]
                  p.write_text(t)
                  updated = True
          if not updated:
              print("No interface patch required; check the declaration shown above.")
          else:
              print("Patched ReceiptOpts with optional pixelWidth.")
          PY

      - name: Use legacy ESC/POS bit-image command for wider printer compatibility
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/lib/escpos.ts")
          s = p.read_text()
          start = s.index("export function encodeReceipt(")
          replacement = '''export function encodeReceipt(job: ReceiptJob, opts: EscposOpts = {}): Uint8Array {
            const bytes: number[] = []
            const push = (...values: number[]) => bytes.push(...values)
            const width = opts.pixelWidth ?? job.pixelWidth ?? 384
            push(0x1b, 0x40) // ESC @
            push(0x1b, 0x61, 0x00) // left alignment

            // Legacy ESC * 24-dot bit image is supported by older compact printers
            // that may feed paper but ignore the newer GS v 0 raster command.
            const image = rasterize(job, width)
            const bytesPerRow = image.rowBytes
            for (let top = 0; top < image.height; top += 24) {
              const rows = Math.min(24, image.height - top)
              push(0x1b, 0x33, 24) // line spacing = 24 dots
              push(0x1b, 0x2a, 33, bytesPerRow & 0xff, (bytesPerRow >> 8) & 0xff)
              for (let x = 0; x < width; x++) {
                for (let bitRow = 0; bitRow < 24; bitRow++) {
                  let value = 0
                  if (bitRow < rows) {
                    const src = (top + bitRow) * bytesPerRow + (x >> 3)
                    value = (image.data[src] >> (7 - (x & 7))) & 1
                  }
                  // ESC * 24-dot mode expects three vertical bytes per column.
                  if (bitRow < 8 && value) bytes.push(0) // placeholder; packed below
                }
              }
              // Pack the 24 vertical dots for each column, MSB first.
              for (let x = 0; x < width; x++) {
                for (let band = 0; band < 3; band++) {
                  let packed = 0
                  for (let b = 0; b < 8; b++) {
                    const bitRow = band * 8 + b
                    if (bitRow < rows) {
                      const src = (top + bitRow) * bytesPerRow + (x >> 3)
                      if ((image.data[src] >> (7 - (x & 7))) & 1) packed |= 0x80 >> b
                    }
                  }
                  bytes.push(packed)
                }
              }
              push(0x0a)
            }
            push(0x1b, 0x32) // restore default line spacing
            const feed = opts.feed ?? 3
            for (let i = 0; i < feed; i++) push(0x0a)
            if (opts.cut ?? false) push(0x1d, 0x56, 0x01)
            return Uint8Array.from(bytes)
          }
          '''
          s = s[:start] + replacement
          p.write_text(s)
          print("Switched receipt output from GS v 0 to legacy ESC * 24-dot bit-image mode.")
          PY

      - name: Install dependencies
        working-directory: pos-android
        run: npm ci

      - name: Build web app
        working-directory: pos-android
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: pos-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: pos-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package exact source used for build
        run: |
          zip -qr POS-latest-source-built.zip pos-android .github/workflows/build-pos-android.yml -x "pos-android/node_modules/*" "pos-android/android/.gradle/*" "pos-android/android/app/build/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-debug-apk
          path: pos-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact source used for build
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-full-project-source
          path: POS-latest-source-built.zip
          if-no-files-found: error
          retention-days: 30
