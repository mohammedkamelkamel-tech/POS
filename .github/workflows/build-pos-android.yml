name: Build POS Android from latest uploaded source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "butcher-pos-full-project-source-fixed.zip"
      - ".github/workflows/build-pos-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract the exact uploaded source archive
        run: |
          test -f butcher-pos-full-project-source-fixed.zip
          rm -rf pos-android /tmp/butcher-source
          mkdir -p /tmp/butcher-source
          unzip -q butcher-pos-full-project-source-fixed.zip -d /tmp/butcher-source
          test -d /tmp/butcher-source/pos-android
          cp -a /tmp/butcher-source/pos-android ./pos-android
          rm -rf pos-android/node_modules pos-android/android/.gradle pos-android/android/app/build
          echo "Building source archive SHA256:"
          sha256sum butcher-pos-full-project-source-fixed.zip
          echo "Source root:"
          ls -la pos-android

      - name: Fix Bluetooth printer permission on Android 12+
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/karuhundeveloper/poskacaw/ThermalPrinterPlugin.java")
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          kept = [line for line in lines if "adapter.cancelDiscovery();" not in line]
          removed = len(lines) - len(kept)
          if removed:
              p.write_text("".join(kept))
              print(f"Removed {removed} cancelDiscovery call(s); paired Bluetooth printer connection does not need scanning.")
          else:
              print("No cancelDiscovery call found; source already patched.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate and patch receipt options type
        working-directory: pos-android
        run: |
          echo "ReceiptOpts references:"
          grep -R -n --include='*.ts' --include='*.tsx' --include='*.vue' --exclude-dir=node_modules --exclude-dir=dist 'ReceiptOpts' . || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = []
          for p in Path(".").rglob("*"):
              if p.is_file() and p.suffix in {".ts", ".tsx", ".vue"} and not any(x in {"node_modules","dist","build",".git"} for x in p.parts):
                  try: t = p.read_text()
                  except Exception: continue
                  if "ReceiptOpts" in t: files.append((p,t))
          if not files:
              raise SystemExit("Cannot locate ReceiptOpts in extracted project; inspect source archive layout.")
          updated = False
          for p,t in files:
              m = re.search(r"(?:export\s+)?interface\s+ReceiptOpts\s*\{", t)
              if not m: continue
              depth, i = 1, m.end()
              while i < len(t) and depth:
                  if t[i] == "{": depth += 1
                  elif t[i] == "}": depth -= 1
                  i += 1
              if depth: raise SystemExit(f"Malformed ReceiptOpts interface: {p}")
              body = t[m.end():i-1]
              if "pixelWidth" not in body:
                  t = t[:i-1] + "  pixelWidth?: 120 | 384 | 576;\n" + t[i-1:]
                  p.write_text(t)
                  updated = True
          if not updated:
              print("No interface patch required; check the declaration shown above.")
          else:
              print("Patched ReceiptOpts with optional pixelWidth.")
          PY

      - name: Configure narrow 15mm receipt width
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {count}")
              p.write_text(source.replace(old, new, 1))

          # Keep the 15mm label as requested, but render it at the normal 58mm
          # printer raster width (384 dots, approx. 48mm printable width at 203 DPI).
          replace_once("src/services/capabilities/registry.ts",
                       "pixelWidth?: 384 | 576",
                       "pixelWidth?: 384 | 576", "ReceiptJob type")
          replace_once("src/lib/escpos.ts",
                       "pixelWidth?: 384 | 576",
                       "pixelWidth?: 384 | 576", "ESC/POS options type")

          # Store selection: 16 chars for narrow layout, 32/48 remain unchanged.
          replace_once("src/stores/printer.ts", "export type PaperWidth = 32 | 48",
                       "export type PaperWidth = 16 | 32 | 48", "paper width type")
          replace_once("src/stores/printer.ts", "const paperWidth = ref<PaperWidth>(32)",
                       "const paperWidth = ref<PaperWidth>(16)", "default paper width")
          replace_once("src/stores/printer.ts",
                       "paperWidth.value = all[KEYS.width] === '48' ? 48 : 32",
                       "paperWidth.value = all[KEYS.width] === '48' ? 48 : all[KEYS.width] === '32' ? 32 : 16",
                       "persisted paper width")

          # Add the selector to the exact existing 58mm/80mm controls.
          p = Path("src/pages/printer/PrinterPage.vue")
          source = p.read_text()
          lines = source.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if ':variant="paperWidth === 32 ? \'default\' : \'outline\'"' in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected one 58mm selector variant line, found {len(matches)}")
          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          block = [
              f'{indent}<Button\n',
              f'{indent}  :variant="paperWidth === 16 ? \'default\' : \'outline\'"\n',
              f'{indent}  size="sm"\n',
              f'{indent}  @click="printer.setWidth(16)"\n',
              f'{indent}>15mm</Button>\n',
          ]
          lines[i-1:i-1] = block
          source = "".join(lines)
          replace_test = "pixelWidth: w === 48 ? 576 : 384"
          if source.count(replace_test) != 1:
              raise SystemExit("Test-print raster width expression did not match exactly once")
          source = source.replace(replace_test,
              "pixelWidth: w === 48 ? 576 : 384", 1)
          p.write_text(source)

          # The 15mm selector remains a label only; use the full 58mm-class
          # printable raster and matching 32-character receipt layout.
          replace_once("src/pages/pos/PosPage.vue",
                       "width: usePrinterStore().paperWidth,",
                       "width: usePrinterStore().paperWidth === 16 ? 32 : usePrinterStore().paperWidth,",
                       "15mm receipt text columns")

          # Never issue a blank print: reload the persisted sale and item snapshots
          # when the in-memory checkout result is absent or incomplete.
          # Replace printReceipt by function boundaries, independent of formatting.
          p = Path("src/pages/pos/PosPage.vue")
          source = p.read_text()
          start = source.find("async function printReceipt() {")
          end = source.find("function newTransaction()", start)
          if start < 0 or end < 0:
              raise SystemExit("Cannot locate printReceipt/newTransaction function boundaries")
          new_function = """async function printReceipt() {
            if (printing.value) return
            const current = lastResult.value
            if (!current?.sale?.id) {
              operationError.value = 'بيانات الفاتورة غير متوفرة. افتح الفاتورة من سجل المبيعات وأعد الطباعة.'
              return
            }
            const printer = capabilities.get<PrinterCapability>('printer')
            if (!printer) {
              operationError.value = 'الطابعة غير متصلة أو غير مهيأة. افتح إعدادات الطابعة ثم أعد المحاولة.'
              return
            }
            printing.value = true
            operationError.value = null
            try {
              // Read a fresh immutable snapshot on every print, so a previous
              // print cannot consume or clear the data used by the next print.
              const persisted = await sales.getWithItems(current.sale.id)
              const sale = persisted.sale ?? current.sale
              const items = persisted.items.length > 0 ? persisted.items : current.items
              if (sale.status !== 'completed' || !items.length) {
                throw new Error('لا توجد أصناف محفوظة لهذه الفاتورة؛ أُلغيت الطباعة حتى لا تخرج ورقة فارغة.')
              }
              const width = usePrinterStore().paperWidth
              const job = buildReceipt(sale, items, {
                storeName: settings.storeName,
                storeOwner: settings.storeOwner,
                width: width === 16 ? 32 : width,
                pixelWidth: width === 48 ? 576 : 384,
              })
              if (!job.lines.some(line => line.text.trim().length > 0)) {
                throw new Error('محتوى الفاتورة فارغ؛ لم يتم إرسال أمر للطابعة.')
              }
              await printer.print(job)
            } catch (error) {
              operationError.value = error instanceof Error ? `تعذرت طباعة الإيصال: ${error.message}` : 'تعذرت طباعة الإيصال. تحقق من اتصال الطابعة.'
            } finally {
              printing.value = false
            }
          }"""
          p.write_text(source[:start] + new_function + "\n" + source[end:])

          # Use the same raster width for actual sale receipts, not just test prints.
          # Sale print width is already set by the guarded printReceipt implementation above.
          replace_once("src/lib/receipt.ts",
                       "return { title: `إيصال ${sale.number}`, lines }",
                       "return { title: `إيصال ${sale.number}`, lines, pixelWidth: opts.pixelWidth ?? (w >= 48 ? 576 : 384) }",
                       "receipt job raster width")
          print("15mm mode configured for test and sale receipts; 58mm and 80mm retained.")
          PY

      - name: Install dependencies
        working-directory: pos-android
        run: npm ci

      - name: Inspect patched printer page before build
        working-directory: pos-android
        run: |
          echo "PrinterPage.vue around compiler error:"
          nl -ba src/pages/printer/PrinterPage.vue | sed -n "180,205p"

      - name: Build web app
        working-directory: pos-android
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: pos-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: pos-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package exact source used for build
        run: |
          zip -qr POS-latest-source-built.zip pos-android .github/workflows/build-pos-android.yml -x "pos-android/node_modules/*" "pos-android/android/.gradle/*" "pos-android/android/app/build/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-debug-apk
          path: pos-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact source used for build
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-full-project-source
          path: POS-latest-source-built.zip
          if-no-files-found: error
          retention-days: 30
