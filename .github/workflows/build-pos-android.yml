name: Build POS Android from latest uploaded source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "butcher-pos-full-project-source-fixed.zip"
      - ".github/workflows/build-pos-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract the exact uploaded source archive
        run: |
          test -f butcher-pos-full-project-source-fixed.zip
          rm -rf pos-android /tmp/butcher-source
          mkdir -p /tmp/butcher-source
          unzip -q butcher-pos-full-project-source-fixed.zip -d /tmp/butcher-source
          test -d /tmp/butcher-source/pos-android
          cp -a /tmp/butcher-source/pos-android ./pos-android
          rm -rf pos-android/node_modules pos-android/android/.gradle pos-android/android/app/build
          echo "Building source archive SHA256:"
          sha256sum butcher-pos-full-project-source-fixed.zip
          echo "Source root:"
          ls -la pos-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Align receipt options type with thermal printer width
        working-directory: pos-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("src"), Path(""), Path("android")]
          matches = []
          for root in roots:
              if not root.exists():
                  continue
              for file in root.rglob("*"):
                  if not file.is_file() or file.suffix not in {".ts", ".tsx", ".vue"}:
                      continue
                  if any(part in {"node_modules", "dist", "build", ".git"} for part in file.parts):
                      continue
                  try:
                      data = file.read_text()
                  except Exception:
                      continue
                  if re.search(r"\\b(?:interface|type)\\s+ReceiptOpts\\b", data):
                      matches.append((file, data))
          if not matches:
              raise SystemExit("ReceiptOpts declaration not found in the uploaded source archive")
          changed = False
          for file, data in matches:
              m = re.search(r"(?:export\\s+)?interface\\s+ReceiptOpts\\s*\\{", data)
              if m:
                  depth = 1
                  i = m.end()
                  while i < len(data) and depth:
                      if data[i] == "{": depth += 1
                      elif data[i] == "}": depth -= 1
                      i += 1
                  if depth:
                      raise SystemExit(f"Unclosed ReceiptOpts interface in {file}")
                  body_end = i - 1
                  if "pixelWidth" not in data[m.end():body_end]:
                      data = data[:body_end] + "  pixelWidth?: 384 | 576;\\n" + data[body_end:]
                      file.write_text(data)
                      changed = True
          if not changed:
              print("ReceiptOpts already declares pixelWidth or uses a non-interface type; no edit applied.")
          else:
              print("Added pixelWidth to ReceiptOpts declaration.")
          PY

      - name: Install dependencies
        working-directory: pos-android
        run: npm ci

      - name: Build web app
        working-directory: pos-android
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: pos-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: pos-android/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package exact source used for build
        run: |
          zip -qr POS-latest-source-built.zip pos-android .github/workflows/build-pos-android.yml -x "pos-android/node_modules/*" "pos-android/android/.gradle/*" "pos-android/android/app/build/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-debug-apk
          path: pos-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact source used for build
        uses: actions/upload-artifact@v4
        with:
          name: POS-latest-full-project-source
          path: POS-latest-source-built.zip
          if-no-files-found: error
          retention-days: 30
