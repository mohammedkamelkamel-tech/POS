name: Validate Butcher POS

on:
  push:
    branches:
      - butcher-pos-dev
    paths:
      - "pos-android/**"
      - ".github/workflows/validate-butcher-pos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-android/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
