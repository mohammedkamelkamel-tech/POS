name: Android APK Build
on:
  push:
    branches: [lahmpos-full-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p LahmPOS :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LahmPOS-debug-apk
          path: LahmPOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
